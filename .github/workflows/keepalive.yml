# Hält das kostenlose Supabase-Projekt aktiv (Free-Projekte werden nach längerer Inaktivität pausiert).
name: Supabase wachhalten
on:
  schedule:
    - cron: "17 5 * * 1,4"   # montags und donnerstags
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" -d '{}'
